baseURL: "https://aliamourad.github.io/"
languageCode: en-gb
title: Alia Mourad
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false

params:
  env: production
  description: "Data scientist writing about GPU kernels, Triton, and network analysis."
  author: Alia Mourad
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowPostNavLinks: true

  homeInfoParams:
    Title: "Hi, I'm Alia"
    Content: >
      Data scientist and MSc Informatics graduate from the University of Edinburgh.
      I write about GPU kernel optimisation with Triton, and about network analysis.

  socialIcons:
    - name: github
      url: "https://github.com/aliamourad"
    - name: linkedin
      url: "https://www.linkedin.com/in/aliaem/"
    - name: email
      url: "mailto:aliaemourad@gmail.com"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: CV
      url: /cv.pdf
      weight: 2
    - name: Search
      url: /search/
      weight: 3

outputs:
  home: [HTML, RSS, JSON]

markup:
  highlight:
    noClasses: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
